name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          echo "════════════════════════════════════════════"
          echo "🧪 PYTEST — SUITE DE PRUEBAS"
          echo "════════════════════════════════════════════"
          mkdir -p diagnostics
          pytest tests/ -v --tb=short --junit-xml=diagnostics/test_results.xml
        env:
          PYTHONPATH: "."
          BEAL_Z3_HEAVY: "1"
          COLLATZ_HEAVY: "1"

      - name: Coherence Guard
        run: |
          python - <<'EOF'
          import xml.etree.ElementTree as ET
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          xml_path = Path("diagnostics/test_results.xml")
          if not xml_path.exists():
              print("ℹ️  No test_results.xml; se omite la guarda.")
              raise SystemExit(0)

          raiz = ET.parse(xml_path).getroot()
          suites = [raiz] if raiz.tag == "testsuite" else list(raiz.iter("testsuite"))

          total = failures = errors = skipped = 0
          for s in suites:
              total += int(s.get("tests", 0) or 0)
              failures += int(s.get("failures", 0) or 0)
              errors += int(s.get("errors", 0) or 0)
              skipped += int(s.get("skipped", 0) or 0)

          failed = failures + errors
          passed = total - failed - skipped
          rate = (passed / total * 100) if total else 0.0

          hist_path = Path("diagnostics/coherence_history.json")
          hist = []
          if hist_path.exists():
              try:
                  hist = json.loads(hist_path.read_text())
              except json.JSONDecodeError:
                  hist = []

          entrada = {
              "utc": datetime.now(timezone.utc).isoformat(),
              "sha": os.environ.get("GITHUB_SHA", "")[:12],
              "ref": os.environ.get("GITHUB_REF", ""),
              "run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "run_number": os.environ.get("GITHUB_RUN_NUMBER", ""),
              "workflow": os.environ.get("GITHUB_WORKFLOW", ""),
              "event": os.environ.get("GITHUB_EVENT_NAME", ""),
              "total": total,
              "passed": passed,
              "failures": failures,
              "errors": errors,
              "failed": failed,
              "skipped": skipped,
              "rate": round(rate, 2),
              "previo": None,
          }

          estado = "BASELINE"
          if hist:
              ultimo = hist[-1]
              previo = ultimo.get("passed")
              entrada["previo"] = previo
              if previo is not None and passed < previo:
                  estado = "REGRESSION"
              elif previo is not None and passed > previo:
                  estado = "IMPROVEMENT"
              else:
                  estado = "STABLE"

          entrada["estado"] = estado
          hist.append(entrada)
          hist = hist[-100:]

          hist_path.parent.mkdir(exist_ok=True)
          hist_path.write_text(json.dumps(hist, indent=2), encoding="utf-8")

          icono_estado = {
              "STABLE": "✅ STABLE",
              "IMPROVEMENT": "✅ IMPROVEMENT",
              "REGRESSION": "❌ REGRESSION",
              "BASELINE": "ℹ️  BASELINE",
          }.get(estado, estado)

          W = "════════════════════════════════════════════"
          print(W)
          print("❤️ COHERENCE GUARD")
          print(W)
          print(f"🔢 Tests totales        {total}")
          print(f"✅ Passed               {passed}")
          print(f"❌ Failures             {failures}")
          print(f"🚨 Errors               {errors}")
          print(f"❌ Failed               {failed}")
          print(f"⏭️ Skipped              {skipped}")
          print(f"📊 Rate                 {rate:.2f}%")
          print(f"🧬 Estado               {icono_estado}")
          print(f"📡 SHA                  {entrada['sha']}")
          print(W)

          if estado == "REGRESSION":
              print(f"❌ REGRESIÓN: {entrada['previo']} -> {passed}")
              raise SystemExit(1)
          EOF

      - name: Run Omega Report
        run: |
          if [ -f diagnostics/omega_report.py ]; then
            python diagnostics/omega_report.py
          else
            echo "diagnostics/omega_report.py not found; skipping Omega Report."
          fi

      - name: Publish Omega Diary
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          python diagnostics/omega_diary_publisher.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Omega diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omega-diagnostics
          path: diagnostics/
          if-no-files-found: warn

      - name: Commit diagnostic history
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name  "omega-ci"
          git config user.email "omega-ci@villasmil.dev"
          git add diagnostics/coherence_history.json diagnostics/OMEGA_REPORT.md
          git diff --staged --quiet || git commit -m "ci: coherence update $(date -u '+%Y-%m-%d %H:%M') [skip ci]"
          git pull --rebase -X ours origin main || true
          git push
